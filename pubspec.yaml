name: "Wonderly"
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.3.0
  cupertino_icons: ^1.0.8
  go_router: ^18.0.2
  dio: ^5.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.13.1"

# Configuration for generating app icons
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  adaptive_icon_background: "#0F5A50"
  image_path: "assets/explore_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  # Register assets directory
  assets:
    - assets/explore_icon.png